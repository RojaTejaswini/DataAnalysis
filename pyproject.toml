[project]
name = "mypackages"
version = "0.1.0"
description = "Reusable data analysis utilities and tools"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "langchain>=0.2.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]